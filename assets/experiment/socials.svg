<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 72" width="1200" height="72" role="img" aria-label="Socials — @nikkoabucejo on Instagram, Threads, LinkedIn and YouTube">
  <title>@nikkoabucejo — Instagram · Threads · LinkedIn · YouTube</title>

  <!--
    ┌─────────────────────────────────────────────────────────────┐
    │  THE CHANNELS — 72px, the shortest card in the set            │
    │                                                              │
    │  One handle across every channel, so the handle is written    │
    │  once and the marks carry the difference. Four marks, a       │
    │  handle and a legend — and nothing else. No jars, no bench     │
    │  line, no vapour: this card is a label, not a scene, and       │
    │  anything else on it crowds the marks at fit-width.            │
    │                                                              │
    │  Every mark is drawn on the theme's own 1.4px stroke. Threads  │
    │  takes the stand-in treatment — the @ sigil it is named for,   │
    │  in the card's own mono — because its inner curl turns to      │
    │  mush at this stroke in a 20px box.                            │
    └─────────────────────────────────────────────────────────────┘
  -->

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: "Helvetica Neue", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }

    .settle { animation: settle 1s cubic-bezier(.16,.84,.28,1) both }
    @keyframes settle { from { opacity: 0; transform: translateY(13px) } to { opacity: 1; transform: none } }
    .fade { animation: fade 1.4s ease both }
    @keyframes fade { from { opacity: 0 } }

    /*  Atmosphere is an effect of the bench, so it may not precede it. Vapour,
     *  dust and the fire's wash on the benchtop come up on their own long
     *  ramps, after the apparatus that causes them has landed — the room fills
     *  rather than switching on.  */
    .warm { animation: comeup 2s cubic-bezier(.4,0,.5,1) .85s both }
    .haze { animation: comeup 3s cubic-bezier(.35,0,.5,1) 1.3s both }
    @keyframes comeup { from { opacity: 0 } }
    .d1 { animation-delay: .05s } .d2 { animation-delay: .26s } .d3 { animation-delay: .42s }
    .d4 { animation-delay: .58s } .d5 { animation-delay: .74s } .d6 { animation-delay: .92s }

    .lamp { animation: lamp 2.2s ease-in-out infinite }
    @keyframes lamp { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
    .mote { opacity: .22 }

    /* fire — every layer licks on its own clock, none of them in step */
    .fl { transform-box: fill-box; transform-origin: 50% 100%; animation: lick 1.15s ease-in-out infinite }
    .l1 { animation-duration: .82s; animation-delay: -.2s }
    .l2 { animation-duration: .61s; animation-delay: -.35s }
    @keyframes lick { 0%,100% { transform: scale(1,1) } 28% { transform: scale(.88,1.13) skewX(3deg) }
                     56% { transform: scale(1.09,.93) skewX(-4deg) } 78% { transform: scale(.94,1.06) } }
    .glow { transform-box: fill-box; transform-origin: center; animation: pyre 2.6s ease-in-out infinite }
    @keyframes pyre { 0%,100% { transform: scale(1); opacity: .9 } 50% { transform: scale(1.16); opacity: .6 } }

    /* boiling liquid: the surface churns and the body brightens with it */
    .hot { animation: boil 2.9s ease-in-out infinite }
    @keyframes boil { 0%,100% { opacity: .16 } 50% { opacity: .3 } }
    .men { transform-box: fill-box; transform-origin: center; animation: swash 3.4s ease-in-out infinite }
    @keyframes swash { 0%,100% { transform: translateY(0) scaleY(1) } 33% { transform: translateY(-1.2px) scaleY(1.5) }
                      66% { transform: translateY(.8px) scaleY(.7) } }

    /* coolant marching through the jacket, and the ripple a drop leaves */
    .cool { stroke-dasharray: 7 13; animation: flow 1.5s linear infinite }
    .cool2 { stroke-dasharray: 7 13; animation: flow 1.5s linear infinite reverse }
    @keyframes flow { to { stroke-dashoffset: -20 } }
    @keyframes ripple { 0% { transform: none; opacity: .85 } 100% { transform: scale(4.5,2.6); opacity: 0 } }
    /*  Anything that animates scale() MUST declare fill-box. The SVG default is
     *  view-box, which resolves transform-origin against the whole 1200-wide
     *  viewBox — a bubble would then scale about the middle of the card and
     *  visibly slide sideways as it grew. This one line is why drops fall
     *  straight, bubbles rise straight, and smoke swells where it stands.  */
    .rip, .drop, .bub, .sm { transform-box: fill-box; transform-origin: center }

    /*  The marks pip left to right on a 5s round, 0.16s apart — the same
     *  rhythm the drip line keeps, on its own timeline so the echo between the
     *  two strips is deliberate and never a frame-lock.  */
    .mk { opacity: .55; animation: pip 5s cubic-bezier(.15,.75,.3,1) infinite }
    @keyframes pip { 0% { opacity: 1 } 14% { opacity: .55 } 100% { opacity: .55 } }
    .m2 { animation-delay: .16s } .m3 { animation-delay: .32s } .m4 { animation-delay: .48s }

    /* declared last on purpose — see Card.l() */


    @media (prefers-reduced-motion: reduce) {
      .settle, .fade { animation: none; opacity: 1; transform: none }
      .lamp { animation: none; opacity: .85 }
      /* the bench at rest: nothing boiling, nothing falling, fire steady */
      .bub, .drop, .rip, .vap { display: none }
      .fl, .glow, .hot, .men, .cool, .cool2, .sm, .mote { animation: none }
      .hot { opacity: .22 }
      /* no pip to run: every mark rests evenly lit */
      .mk { animation: none; opacity: .9 }
    }
  </style>

  <defs>
    <radialGradient id="gSmoke" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e9f2fb" stop-opacity=".14"/>
      <stop offset="55%" stop-color="#e9f2fb" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#e9f2fb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gFire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a45" stop-opacity=".4"/>
      <stop offset="45%" stop-color="#ff7a45" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gLiq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9f2fb" stop-opacity=".5"/>
      <stop offset="8%" stop-color="#38506b" stop-opacity="1"/>
      <stop offset="52%" stop-color="#38506b" stop-opacity=".96"/>
      <stop offset="100%" stop-color="#38506b" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1119" stop-opacity="1"/>
      <stop offset="55%" stop-color="#070b10" stop-opacity="1"/>
      <stop offset="100%" stop-color="#04060a" stop-opacity="1"/>
    </linearGradient>

    <clipPath id="frame"><rect width="1200" height="72" rx="16"/></clipPath>
  </defs>

  <rect width="1200" height="72" rx="16" fill="url(#gDark)"/>
  <g clip-path="url(#frame)">
  <g class="settle d2"><g class="mk m1" transform="translate(176 26)"><rect x="1" y="1" width="18" height="18" rx="5.2" fill="none" stroke="#ff7a45" stroke-width="1.4"/><circle cx="10" cy="10" r="4.7" fill="none" stroke="#ff7a45" stroke-width="1.4"/><circle cx="14.6" cy="5.4" r="1.15" fill="#ff7a45"/></g><g class="mk m2" transform="translate(234 26)"><rect x="1" y="1" width="18" height="18" rx="4.2" fill="none" stroke="#ff7a45" stroke-width="1.4"/><text x="10" y="14.4" class="mono" font-size="12.5" fill="#ff7a45" text-anchor="middle">@</text></g><g class="mk m3" transform="translate(292 26)"><rect x="1" y="1" width="18" height="18" rx="4.2" fill="none" stroke="#ff7a45" stroke-width="1.4"/><text x="10" y="14.2" class="mono" font-size="11" font-weight="700" fill="#ff7a45" text-anchor="middle">in</text></g><g class="mk m4" transform="translate(350 26)"><rect x=".8" y="3.6" width="18.4" height="12.8" rx="4" fill="none" stroke="#ff7a45" stroke-width="1.4"/><path d="M7.7 6.9 13.2 10 7.7 13.1Z" fill="#ff7a45"/></g></g>
  <g class="settle d1">
    <rect class="lamp" x="32" y="32" width="7" height="7" fill="#ff7a45"/>
    <text x="50" y="40" class="mono" font-size="9.5" letter-spacing="3.4" fill="#ff7a45">CHANNELS</text>
    <text x="422" y="41" class="mono" font-size="12" letter-spacing="3" fill="#e9f2fb" opacity=".92"><tspan fill="#ff7a45">@</tspan>NIKKOABUCEJO</text>
    <text x="1168" y="40" class="mono" font-size="8.5" letter-spacing="2.6" fill="#7e94ab" text-anchor="end" opacity=".78">INSTAGRAM · THREADS · LINKEDIN · YOUTUBE</text>
  </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="71" rx="16" fill="none" stroke="#1d2836"/>
</svg>
