<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="Live signal divider">
  <title>Signal — 72 BPM</title>

  <!--
    ┌─────────────────────────────────────────────────────────────┐
    │  SIGNAL STRIP — divider between sheets 01 and 02             │
    │                                                             │
    │  Same plate language as hero.svg: #070a0e ground, 20/100    │
    │  grid, cyan #22d3ee accent, mono labels, corner marks.      │
    │                                                             │
    │  The trace is a real 3-beat ECG (P wave · QRS · T wave) but  │
    │  nothing of it is drawn at rest — the line exists only       │
    │  inside a travelling mask, so all that is ever visible is    │
    │  the live head and the tail falling away behind it.          │
    │                                                             │
    │  That mask is a gradient which REPEATS every 936px — exactly │
    │  one sweep of x — opaque at each head and gone 200px behind  │
    │  it. Sliding it one full period per sweep leaves the loop    │
    │  with no seam to hide: as one head runs off the right, the   │
    │  tail behind it keeps draining out on its own while the      │
    │  next head is already entering from the left. Nothing        │
    │  blinks, nothing resets.                                     │
    │                                                             │
    │  Beat amplitude is held to 62% so the R spike and the head's │
    │  glow both clear the frame — 26px of air above, 37px below.  │
    │  Sweep = 2.5s for 3 beats = 72 BPM, matching the label. The  │
    │  head rides the same x the mask does, so it can never drift  │
    │  off the lit edge; it only fades across the wrap, where the  │
    │  trace ends.                                                 │
    └─────────────────────────────────────────────────────────────┘
  -->

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }

    /* one gradient period per sweep: the pattern lands exactly where it
       started, so there is no wrap to blink over */
    .run { animation: run 2.5s linear infinite }
    @keyframes run { from { transform: translateX(152px) } to { transform: translateX(1088px) } }

    /* head rides the same x the mask does, so the two cannot drift apart.
       It only fades across the wrap, where the trace ends. */
    .head { transform: translate(152px, 55px);
            animation: ride 2.5s linear infinite, cross 2.5s linear infinite }
    @keyframes cross { 0% { opacity: 0 } 4%,95% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes ride {
      0%{transform:translate(152.00px,55.00px)} 2.273%{transform:translate(173.27px,55.00px)} 4.545%{transform:translate(194.55px,55.00px)} 6.818%{transform:translate(215.82px,54.31px)}
      9.091%{transform:translate(237.09px,51.08px)} 11.36%{transform:translate(258.36px,55.00px)} 13.64%{transform:translate(279.64px,58.61px)} 15.91%{transform:translate(300.91px,45.41px)}
      18.18%{transform:translate(322.18px,55.00px)} 20.45%{transform:translate(343.45px,55.00px)} 22.73%{transform:translate(364.73px,49.83px)} 25%{transform:translate(386.00px,48.26px)}
      27.27%{transform:translate(407.27px,53.43px)} 29.55%{transform:translate(428.55px,55.00px)} 31.82%{transform:translate(449.82px,55.00px)} 34.09%{transform:translate(471.09px,55.00px)}
      36.36%{transform:translate(492.36px,55.00px)} 38.64%{transform:translate(513.64px,55.00px)} 40.91%{transform:translate(534.91px,52.25px)} 43.18%{transform:translate(556.18px,51.93px)}
      45.45%{transform:translate(577.45px,55.00px)} 47.73%{transform:translate(598.73px,54.05px)} 50%{transform:translate(620.00px,72.00px)} 52.27%{transform:translate(641.27px,55.00px)}
      54.55%{transform:translate(662.55px,54.76px)} 56.82%{transform:translate(683.82px,48.55px)} 59.09%{transform:translate(705.09px,49.23px)} 61.36%{transform:translate(726.36px,55.00px)}
      63.64%{transform:translate(747.64px,55.00px)} 65.91%{transform:translate(768.91px,55.00px)} 68.18%{transform:translate(790.18px,55.00px)} 70.45%{transform:translate(811.45px,55.00px)}
      72.73%{transform:translate(832.73px,55.00px)} 75%{transform:translate(854.00px,51.18px)} 77.27%{transform:translate(875.27px,53.71px)} 79.55%{transform:translate(896.55px,55.00px)}
      81.82%{transform:translate(917.82px,33.36px)} 84.09%{transform:translate(939.09px,62.73px)} 86.36%{transform:translate(960.36px,55.00px)} 88.64%{transform:translate(981.64px,51.90px)}
      90.91%{transform:translate(1002.91px,48.03px)} 93.18%{transform:translate(1024.18px,50.97px)} 95.45%{transform:translate(1045.45px,55.00px)} 97.73%{transform:translate(1066.73px,55.00px)}
      100%{transform:translate(1088.00px,55.00px)}
    }

    .led { animation: blink 2.5s steps(1) infinite }
    @keyframes blink { 0%,42% { opacity: 1 } 42.01%,100% { opacity: .25 } }

    @media (prefers-reduced-motion: reduce) {
      /* no sweep to show, so the otherwise-hidden trace stands in */
      .live, .head { display: none }
      .dim { opacity: .45 }
      .led { animation: none }
    }
  </style>

  <defs>
    <pattern id="pMinor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0V20M0 20H20" stroke="#10202b" stroke-width="1"/>
    </pattern>
    <pattern id="pMajor" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0V100M0 100H100" stroke="#17303f" stroke-width="1"/>
    </pattern>
    <radialGradient id="pFade" cx="34%" cy="50%" r="78%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="58%" stop-color="#fff" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="pGrid"><rect width="1200" height="110" fill="url(#pFade)"/></mask>
    <radialGradient id="pGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <!-- one period == one sweep of x (936). Opaque at the head, gone 200px
         behind it, then flat until the head before it. spreadMethod="repeat"
         tiles it end to end, which is what makes the loop seamless. -->
    <linearGradient id="pTailG" gradientUnits="userSpaceOnUse" spreadMethod="repeat"
                    x1="0" y1="0" x2="936" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="78.63%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="88.5%" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="95.5%" stop-color="#fff" stop-opacity=".6"/>
      <stop offset="99%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="pTail">
      <g class="run"><rect x="-1872" y="0" width="3744" height="110" fill="url(#pTailG)"/></g>
    </mask>
    <clipPath id="pFrame"><rect x="1" y="1" width="1198" height="108" rx="18"/></clipPath>
  </defs>

  <!-- ══ SHEET ════════════════════════════════════════════ -->
  <rect width="1200" height="110" rx="18" fill="#070a0e"/>
  <g clip-path="url(#pFrame)" mask="url(#pGrid)">
    <rect width="1200" height="110" fill="url(#pMinor)"/>
    <rect width="1200" height="110" fill="url(#pMajor)"/>
  </g>
  <rect x="1" y="1" width="1198" height="108" rx="18" fill="none" stroke="#1e3646"/>

  <!-- ══ RULERS ═══════════════════════════════════════════ -->
  <g stroke="#17303f" fill="none" stroke-width="1">
    <path d="M100 1v7M200 1v4M300 1v7M400 1v4M500 1v7M600 1v4M700 1v7M800 1v4M900 1v7M1000 1v4M1100 1v7"/>
    <path d="M100 109v-7M300 109v-7M500 109v-7M700 109v-7M900 109v-7M1100 109v-7"/>
  </g>

  <!-- ══ REGISTRATION MARKS ═══════════════════════════════ -->
  <path d="M20 34V20h14M1166 20h14v14M1180 76v14h-14M34 90H20V76"
        fill="none" stroke="#22d3ee" stroke-width="1.4" opacity=".5"/>

  <!-- ══ LABELS ═══════════════════════════════════════════ -->
  <rect class="led" x="32" y="51" width="7" height="7" fill="#22d3ee"/>
  <text x="50" y="59" class="mono" font-size="9.5" letter-spacing="3.4" fill="#22d3ee">SIGNAL</text>
  <text x="1168" y="59" class="mono" font-size="9.5" letter-spacing="3.4" fill="#75899a"
        text-anchor="end" opacity=".8">72 BPM</text>

  <!-- ══ TRACE ════════════════════════════════════════════ -->
  <g fill="none" stroke="#22d3ee" stroke-linecap="round" stroke-linejoin="round">
    <!-- hidden at rest; revealed only for prefers-reduced-motion -->
    <path class="dim" d="M152 55L214 55Q234 47 255 55L275 55L284 62L296 27L308 72L321 55L350 55Q380 41 411 55L464 55L526 55Q546 47 567 55L587 55L596 62L608 27L620 72L633 55L662 55Q692 41 723 55L776 55L838 55Q858 47 879 55L899 55L908 62L920 27L932 72L945 55L974 55Q1004 41 1035 55L1088 55" stroke-width="1.4" opacity="0"/>
    <g mask="url(#pTail)"><path class="live" d="M152 55L214 55Q234 47 255 55L275 55L284 62L296 27L308 72L321 55L350 55Q380 41 411 55L464 55L526 55Q546 47 567 55L587 55L596 62L608 27L620 72L633 55L662 55Q692 41 723 55L776 55L838 55Q858 47 879 55L899 55L908 62L920 27L932 72L945 55L974 55Q1004 41 1035 55L1088 55" stroke-width="1.9"/></g>
  </g>
  <g class="head">
    <circle r="16" fill="url(#pGlow)"/>
    <circle r="3.2" fill="#22d3ee"/>
  </g>
</svg>
